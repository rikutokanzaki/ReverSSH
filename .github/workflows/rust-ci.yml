name: Rust CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        run: |
          RUST_VERSION="$(sed -nE 's/^channel = "([^"]+)"$/\1/p' rust-toolchain.toml)"
          test -n "$RUST_VERSION"
          rustup toolchain install "${RUST_VERSION}" --profile minimal --no-self-update
          rustup default "${RUST_VERSION}"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check
        run: cargo check --locked --all-targets --all-features

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Release build
        run: cargo build --locked --release --all-targets --all-features

      - name: Docker build
        run: docker build --file docker/Dockerfile --tag reverssh:ci .
