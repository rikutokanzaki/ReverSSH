name: Security audit

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  issues: write
  checks: write

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        shell: bash
        run: |
          set +e
          cargo audit --json > audit-report.json
          audit_exit=$?
          set -e

          python3 - <<'PY'
          import json
          import os
          import sys

          with open("audit-report.json", encoding="utf-8") as file:
              report = json.load(file)

          fixable = []
          unfixable = []
          for finding in report.get("vulnerabilities", {}).get("list", []):
              advisory = finding["advisory"]
              patched = finding.get("versions", {}).get("patched", [])
              target = f"{advisory['id']} ({advisory['package']})"
              if patched:
                  fixable.append((target, ", ".join(patched)))
              else:
                  unfixable.append(target)

          warnings = report.get("warnings", {})
          blocking_warnings = {
              kind: entries
              for kind, entries in warnings.items()
              if kind in {"unsound", "yanked"} and entries
          }

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as file:
                  file.write("## Cargo audit\n\n")
                  if unfixable:
                      file.write("### Reported only (no patched release)\n")
                      for finding in unfixable:
                          file.write(f"- `{finding}`\n")
                      file.write("\n")
                  if fixable:
                      file.write("### Must fix\n")
                      for finding, patched in fixable:
                          file.write(f"- `{finding}`; patched: `{patched}`\n")
                      file.write("\n")

          if fixable or blocking_warnings:
              print("Fixable advisories found:")
              for finding, patched in fixable:
                  print(f"- {finding}; patched: {patched}")
              for kind, entries in blocking_warnings.items():
                  print(f"Blocking {kind} warnings found: {len(entries)}")
              sys.exit(1)

          print("No advisories with an available patched release were found.")
          if unfixable:
              print("Unfixable advisories were retained in audit-report.json.")
          PY

          # cargo-audit exits non-zero for reported advisories, including
          # advisories without a patched release. The Python gate above makes
          # that distinction explicitly; preserve other audit failures.
          if [ "$audit_exit" -ne 0 ] && [ ! -s audit-report.json ]; then
            exit "$audit_exit"
          fi

      - name: Upload cargo audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: audit-report.json
