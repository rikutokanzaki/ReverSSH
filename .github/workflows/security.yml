name: Security audit

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  issues: write
  checks: write

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        shell: bash
        run: |
          set +e
          cargo audit --json > audit-report.json
          audit_exit=$?

          python3 .github/scripts/cargo_audit_report.py --report audit-report.json
          report_exit=$?

          if [ "$report_exit" -ne 0 ]; then
            exit "$report_exit"
          fi
          if [ "$audit_exit" -ne 0 ] && [ ! -s audit-report.json ]; then
            exit "$audit_exit"
          fi

      - name: Upload cargo audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: audit-report.json

  docker-image-audit:
    uses: ./.github/workflows/docker-image-audit.yml
    permissions:
      contents: read
