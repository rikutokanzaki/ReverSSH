name: SSH E2E

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: SSH/PTY E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run SSH/PTY E2E tests
        run: >-
          docker compose
          --file tests/compose/docker-compose.test.yml
          up
          --build
          --abort-on-container-exit
          --exit-code-from e2e

      - name: Collect E2E logs
        if: always()
        run: docker compose --file tests/compose/docker-compose.test.yml logs --no-color

      - name: Tear down E2E environment
        if: always()
        run: docker compose --file tests/compose/docker-compose.test.yml down --volumes --remove-orphans
