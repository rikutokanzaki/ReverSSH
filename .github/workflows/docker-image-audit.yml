name: Docker image audit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: Scan Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.2
          cache: true

      - name: Audit Docker images
        uses: ./.github/actions/docker-image-audit

      - name: Upload Docker audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-audit-report
          path: docker-audit/
